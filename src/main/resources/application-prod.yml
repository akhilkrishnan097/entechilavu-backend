spring:
  application:
    name: entechilavu
  datasource:
    url: jdbc:postgresql://${DB_URL}/expense_manager
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
app:
  jwt:
    secret: ${TOKEN_SECRET}
    expiration-ms: 3600000